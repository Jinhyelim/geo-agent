services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    container_name: geo-agent-db
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    ports:
      - "5433:5432"   # 다른 프로젝트의 PostgreSQL(5432)과 겹치지 않게 5433 사용
    volumes:
      - geo-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      retries: 10

volumes:
  geo-data:
